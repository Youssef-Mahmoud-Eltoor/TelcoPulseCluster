services:
  # 1. Main Production Database (Laptop 5)
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-node5
    ports:
      - "0.0.0.0:8123:8123"   # HTTP API for Spark Workers & Superset
      - "0.0.0.0:9000:9000"   # Native TCP for CLI / drivers
    environment:
      - CLICKHOUSE_DB=telecom_db
      - CLICKHOUSE_USER=admin
      - CLICKHOUSE_PASSWORD=bigdata123
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ./ch_data:/var/lib/clickhouse
      - ./ch_logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped

  # 2. Local Kafka Simulator (Kept idle until Phase 4)
  kafka-sim:
    image: apache/kafka:latest
    container_name: kafka-simulator
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-sim:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-sim:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
  # 3. Visualization Layer
  superset:
    image: apache/superset:latest
    container_name: superset-node5
    ports:
      - "8088:8088"
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:?Set SUPERSET_SECRET_KEY before starting Superset}
    volumes:
      - ./superset_home:/app/superset_home
    depends_on:
      - clickhouse
    restart: unless-stopped
